<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Scenarios</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #scenarioCategoriesGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .scenario-category-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; cursor: pointer; }
        .scenario-category-card:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>🔍 Debug Scenarios System</h1>
    
    <div class="debug-info">
        <h3>Debug Information:</h3>
        <div id="debugOutput">Loading...</div>
    </div>

    <div class="debug-info">
        <h3>Actions:</h3>
        <button onclick="testLoadScenarios()">Test Load Scenarios</button>
        <button onclick="testRenderCategories()">Test Render Categories</button>
        <button onclick="clearDebug()">Clear Debug</button>
    </div>

    <div id="scenarioCategoriesGrid">
        <!-- Categories will be rendered here -->
    </div>

    <script>
        // Mock scenarios data
        const scenariosByCategory = {
            "Allergies & Diet": [
                {
                    title: "Khách dị ứng gluten",
                    situation: "Khách hàng hỏi về món ăn không chứa gluten...",
                    options: ["Option 1", "Option 2", "Option 3"],
                    correct: 0,
                    level: "basic"
                }
            ],
            "Dịch vụ khách hàng": [
                {
                    title: "Khách phàn nàn về thời gian chờ",
                    situation: "Khách hàng phàn nàn đã chờ 30 phút...",
                    options: ["Option A", "Option B", "Option C"],
                    correct: 0,
                    level: "basic"
                }
            ]
        };

        function log(message, type = 'info') {
            const debugOutput = document.getElementById('debugOutput');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            debugOutput.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            console.log(`[${timestamp}] ${message}`);
        }

        function clearDebug() {
            document.getElementById('debugOutput').innerHTML = '';
        }

        function testLoadScenarios() {
            log('Testing loadScenarios...', 'info');
            
            try {
                // Check if scenariosByCategory exists
                if (typeof scenariosByCategory !== 'undefined') {
                    log(`Found ${Object.keys(scenariosByCategory).length} categories`, 'success');
                    Object.keys(scenariosByCategory).forEach(category => {
                        log(`Category: ${category} - ${scenariosByCategory[category].length} scenarios`, 'success');
                    });
                } else {
                    log('scenariosByCategory is undefined!', 'error');
                }
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        function testRenderCategories() {
            log('Testing renderScenarioCategories...', 'info');
            
            try {
                const container = document.getElementById('scenarioCategoriesGrid');
                if (!container) {
                    log('scenarioCategoriesGrid container not found!', 'error');
                    return;
                }
                
                log('Container found, rendering categories...', 'success');
                container.innerHTML = '';

                Object.entries(scenariosByCategory).forEach(([category, scenarios]) => {
                    log(`Rendering category: ${category}`, 'info');
                    
                    const categoryCard = document.createElement('div');
                    categoryCard.className = 'scenario-category-card';
                    categoryCard.innerHTML = `
                        <h3>${category}</h3>
                        <p>${scenarios.length} tình huống</p>
                        <button onclick="selectCategory('${category}')">Chọn danh mục</button>
                    `;
                    
                    container.appendChild(categoryCard);
                    log(`Category card created for: ${category}`, 'success');
                });
                
                log(`Rendered ${Object.keys(scenariosByCategory).length} category cards`, 'success');
                
            } catch (error) {
                log(`Error rendering categories: ${error.message}`, 'error');
            }
        }

        function selectCategory(category) {
            log(`Category selected: ${category}`, 'success');
            alert(`Bạn đã chọn danh mục: ${category}`);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            log('Page loaded, starting debug...', 'success');
            testLoadScenarios();
            testRenderCategories();
        });
    </script>
</body>
</html>
