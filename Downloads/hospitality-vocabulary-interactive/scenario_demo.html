    <script>

            constructor() {
                this.scenariosByCategory = {

                            situation: "Kh�ch h�ng h�i v� m�n n kh�ng ch�a gluten v� t� ra lo l�ng v� t�nh tr�ng d� �ng nghi�m tr�ng.",
                            options: [

                                "Ch� g�i � salad � an to�n nh�t",
                                "H�i kh�ch mang thu�c ch�ng d� �ng ch�a"
                            ],
                            correct: 0,
                            explanation: "Lu�n �m b�o an to�n tuy�t �i, giao ti�p r� r�ng v� quy tr�nh v� l�a ch�n th�c ph�m.",
                            level: "basic",
                            keyPhrases: ["gluten-free", "allergy alert", "safe preparation", "cross-contamination"]
                        }
                    ],
                    "D�ch v� kh�ch h�ng": [
                        {
                            title: "Kh�ch ph�n n�n v� th�i gian ch�",
                            situation: "Kh�ch h�ng ph�n n�n � ch� 30 ph�t m� m�n n ch�a ��c ph�c v�, t� ra b�c b�i.",
                            options: [
                                "Xin l�i ch�n th�nh, gi�i th�ch l� do v� �a ra gi�i ph�p b� �p",
                                "Ch� xin l�i v� h�a m�n s� �n s�m",
                                "� l�i cho b�p v� kh�ng ch�u tr�ch nhi�m"
                            ],
                            correct: 0,
                            explanation: "Ch�u tr�ch nhi�m, giao ti�p t�ch c�c v� �a ra gi�i ph�p c� th� � kh�i ph�c l�ng tin.",
                            level: "basic",
                            keyPhrases: ["sincere apology", "service recovery", "compensation", "customer satisfaction"]
                        }
                    ]
                };
                
                this.currentScenarioIndex = 0;
                this.currentCategory = null;
                this.filteredScenarios = [];
                this.completedScenarios = [];
                
                this.init();
            }
            
            init() {
                this.renderScenarioCategories();
                this.setupEventListeners();
            }
            
            getCategoryIcon(category) {
                const icons = {
                    'Allergies & Diet': '=�',
                    'D�ch v� kh�ch h�ng': '>'
                };
                return icons[category] || '=�';
            }
            
            renderScenarioCategories() {
                const container = document.getElementById('scenarioCategoriesGrid');
                container.innerHTML = '';

                Object.entries(this.scenariosByCategory).forEach(([category, scenarios]) => {
                    const categoryCard = document.createElement('div');
                    categoryCard.className = 'scenario-category-card';
                    categoryCard.innerHTML = `
                        <h3>${this.getCategoryIcon(category)} ${category}</h3>
                        <p>Luy�n t�p ${scenarios.length} t�nh hu�ng th�c t� trong l)nh v�c ${category.toLowerCase()}</p>
                        <div class="scenario-category-stats">
                            <span class="scenario-count">${scenarios.length} t�nh hu�ng</span>
                            <span class="progress">0% ho�n th�nh</span>
                        </div>
                    `;
                    
                    categoryCard.addEventListener('click', () => {
                        this.startCategoryScenarios(category);
                    });
                    
                    container.appendChild(categoryCard);
                });
            }
            
            startCategoryScenarios(category) {
                this.currentCategory = category;
                this.filteredScenarios = [...this.scenariosByCategory[category]];
                this.currentScenarioIndex = 0;
                
                document.getElementById('scenarioCategoriesGrid').style.display = 'none';
                document.getElementById('currentScenarioContainer').style.display = 'block';
                
                this.showCurrentScenario();
            }
            
            showCurrentScenario() {
                if (this.currentScenarioIndex >= this.filteredScenarios.length) {
                    alert('Ch�c m�ng! B�n � ho�n th�nh t�t c� t�nh hu�ng!');
                    this.backToCategories();
                    return;
                }

                const scenario = this.filteredScenarios[this.currentScenarioIndex];
                
                document.getElementById('currentScenarioCategory').textContent = this.currentCategory;
                document.getElementById('currentScenarioLevel').textContent = this.getLevelLabel(scenario.level);
                document.getElementById('scenarioProgress').textContent = `${this.currentScenarioIndex + 1}/${this.filteredScenarios.length}`;
                
                document.getElementById('scenarioTitle').textContent = scenario.title;
                document.getElementById('scenarioSituation').textContent = scenario.situation;

                const choices = document.querySelectorAll('.scenario-choice');
                choices.forEach((choice, index) => {
                    if (scenario.options[index]) {
                        choice.textContent = scenario.options[index];
                        choice.classList.remove('selected');
                        choice.disabled = false;
                        choice.style.display = 'block';
                    } else {
                        choice.style.display = 'none';
                    }
                });

                document.getElementById('scenarioFeedback').classList.add('hidden');
                document.getElementById('prevScenario').disabled = this.currentScenarioIndex === 0;
            }
            
            getLevelLabel(level) {
                const labels = {
                    'basic': '=� C� b�n',
                    'intermediate': '=� Trung c�p',
                    'advanced': '=4 N�ng cao'
                };
                return labels[level] || '=� C� b�n';
            }
            
            handleScenarioChoice(e) {
                if (e.target.classList.contains('selected') || e.target.disabled) return;
                
                document.querySelectorAll('.scenario-choice').forEach(choice => {
                    choice.classList.remove('selected');
                });
                e.target.classList.add('selected');

                setTimeout(() => {
                    const scenario = this.filteredScenarios[this.currentScenarioIndex];
                    const selectedIndex = parseInt(e.target.dataset.choice);
                    const isCorrect = selectedIndex === scenario.correct;

                    document.querySelectorAll('.scenario-choice').forEach(choice => {
                        choice.disabled = true;
                    });

                    const feedback = document.getElementById('scenarioFeedback');
                    const explanation = document.getElementById('scenarioExplanation');
                    const phrasesList = document.getElementById('phrasesList');

                    explanation.textContent = scenario.explanation;
                    
                    phrasesList.innerHTML = '';
                    scenario.keyPhrases.forEach(phrase => {
                        const tag = document.createElement('span');
                        tag.className = 'phrase-tag';
                        tag.textContent = phrase;
                        phrasesList.appendChild(tag);
                    });
                    
                    feedback.classList.remove('hidden');
                    
                    alert(isCorrect ? 'Ch�nh x�c! Tuy�t v�i!' : 'Kh�ng �ng, nh�ng �y l� c� h�i h�c h�i!');
                }, 500);
            }
            
            nextScenario() {
                this.currentScenarioIndex++;
                this.showCurrentScenario();
            }
            
            prevScenario() {
                if (this.currentScenarioIndex > 0) {
                    this.currentScenarioIndex--;
                    this.showCurrentScenario();
                }
            }
            
            backToCategories() {
                document.getElementById('currentScenarioContainer').style.display = 'none';
                document.getElementById('scenarioCategoriesGrid').style.display = 'grid';
                this.currentCategory = null;
            }
            
            setupEventListeners() {
                document.querySelectorAll('.scenario-choice').forEach(choice => {
                    choice.addEventListener('click', (e) => this.handleScenarioChoice(e));
                });

                document.getElementById('nextScenario')?.addEventListener('click', () => this.nextScenario());
                document.getElementById('prevScenario')?.addEventListener('click', () => this.prevScenario());
                document.getElementById('backToCategories')?.addEventListener('click', () => this.backToCategories());
            }
        }
        
        // Initialize demo when page loads
